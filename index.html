<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>myosotis</title>
    <meta name="theme-color" content="#000000">
    <meta property="og:title" content="myosotis">
    <meta property="og:description" content="don't know where i'm going, but i know i ain't going back.">
    <meta property="og:image" content="assets/profile.gif">
    <meta property="og:type" content="profile">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="myosotis">
    <meta name="twitter:description" content="don't know where i'm going, but i know i ain't going back.">
    <meta name="twitter:image" content="assets/profile.gif">
    <link rel="icon" type="image/gif" href="assets/profile.gif">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overscroll-behavior: none;
        }

        .equalizer,
        .profile-picture,
        .social-icon,
        #results-theme {
            touch-action: manipulation;
        }

        
        .custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            background: url('assets/custom_cursor.png') no-repeat center center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        
        body:not(.touch-device) {
            cursor: none;
        }
        
        body:not(.touch-device) *,
        body:not(.touch-device) *::before,
        body:not(.touch-device) *::after {
            cursor: none !important;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        #background {
            position: fixed;
            top: -3%;
            left: -3%;
            width: 106%;
            height: 106%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
        }

        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #overlay, #snow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        #vignette-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 0, 0, 0) 45%,
                rgba(0, 0, 0, 0.55) 100%
            );
        }

        .hidden {
            display: none !important;
        }

        
        .equalizer {
            position: fixed;
            bottom: calc(50% - 240px - 15px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 160px;
            height: 40px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 14px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: border-color 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .equalizer:hover {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .equalizer-hint {
            position: fixed;
            bottom: calc(50% - 240px - 15px + 40px + 8px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 10px;
            border-radius: 10px;
            pointer-events: none;
            white-space: nowrap;
            animation: hintBounce 1.6s ease-in-out infinite;
        }

        @keyframes hintBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.75; }
            50% { transform: translateX(-50%) translateY(-4px); opacity: 1; }
        }

        .eq-bar {
            width: 3px;
            height: 8%;
            border-radius: 2px;
            background: var(--primary-color, #FFFFFF);
            transition: height 0.08s ease, opacity 0.3s, background 0.15s ease;
        }

        .equalizer.paused .eq-bar {
            opacity: 0.35;
        }

        
        #profile-block::-webkit-scrollbar,
        #skills-block::-webkit-scrollbar {
            width: 8px;
        }

        #profile-block::-webkit-scrollbar-track,
        #skills-block::-webkit-scrollbar-track {
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.04) 0px,
                rgba(255, 255, 255, 0.04) 1px,
                transparent 1px,
                transparent 4px
            );
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }

        #profile-block::-webkit-scrollbar-thumb,
        #skills-block::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 0;
            border: 1px solid rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        #profile-block::-webkit-scrollbar-thumb:hover,
        #skills-block::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.75);
        }

        #profile-block::-webkit-scrollbar-corner,
        #skills-block::-webkit-scrollbar-corner {
            background: transparent;
        }

        #profile-block,
        #skills-block {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.4) rgba(255, 255, 255, 0.04);
        }

        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            max-height: 90vh;
            max-height: 90dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out, box-shadow 0.3s ease;
            pointer-events: auto;
            box-shadow:
                0 0 8px rgba(255, 255, 255, 0.55),
                0 0 20px rgba(255, 255, 255, 0.35),
                0 0 40px rgba(255, 255, 255, 0.2),
                0 0 70px rgba(255, 255, 255, 0.12);
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .profile-container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .profile-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 10px 10px,
                var(--primary-color, #FFFFFF) 10%,
                transparent 15%
            );
            animation: orbit 3s linear infinite;
            z-index: -1;
            filter: blur(1px);
            box-shadow: none;
        }

        .profile-container.fast-orbit::after {
            animation: fast-orbit 0.5s linear forwards;
        }

        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
            opacity: 1 !important;
            box-shadow:
                0 0 6px rgba(255, 255, 255, 0.6),
                0 0 16px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 255, 255, 0.25);
        }

        
        .online-status {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            background: #43b581;
            border: 3px solid #000;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 8px rgba(67, 181, 129, 0.9), 0 0 4px rgba(0, 0, 0, 0.6);
            animation: statusBlink 1.4s ease-in-out infinite;
        }

        @keyframes statusBlink {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px rgba(67, 181, 129, 0.9), 0 0 4px rgba(0, 0, 0, 0.6);
            }
            50% {
                opacity: 0.35;
                box-shadow: 0 0 2px rgba(67, 181, 129, 0.4), 0 0 2px rgba(0, 0, 0, 0.6);
            }
        }

        .profile-pic-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .online-text {
            position: absolute;
            bottom: -17px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #43b581;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 10px;
            z-index: 6;
            white-space: nowrap;
        }

        .online-text::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43b581;
            box-shadow: 0 0 6px rgba(67, 181, 129, 0.9);
            animation: statusBlink 1.4s ease-in-out infinite;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .name-and-badges {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        
        #profile-name {
            font-family: 'Retro Gaming', 'Courier New', monospace;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 3px;
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            opacity: 1 !important;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-container {
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .badge-container .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .badge-container:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        .badge-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px;
            border-radius: 15px;
            display: inline-block;
        }

        .badge-box-inner {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .badge {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
            pointer-events: auto;
            opacity: 1 !important;
            filter: grayscale(1) brightness(1.4);
        }

        .badge:hover {
            transform: scale(1.2);
            filter: grayscale(1) brightness(1.4) drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
        }

        #profile-bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 10px;
            opacity: 1 !important;
        }

        .visitor-greeting {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            min-height: 14px;
        }

        
        .spotify-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(29, 185, 84, 0.08);
            border: 1px solid rgba(29, 185, 84, 0.35);
            border-radius: 10px;
            padding: 8px 10px;
            margin-top: 6px;
            margin-bottom: 10px;
            max-width: 360px;
        }

        .spotify-album-art {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .spotify-info {
            flex: 1;
            min-width: 0;
        }

        .spotify-header {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: #1DB954;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .spotify-icon {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
        }

        .spotify-song {
            font-size: 13px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spotify-artist {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .spotify-progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .spotify-progress {
            height: 100%;
            width: 0%;
            background: #1DB954;
            border-radius: 2px;
        }

        .discord-activities {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 360px;
        }

        .activity-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(88, 101, 242, 0.08);
            border: 1px solid rgba(88, 101, 242, 0.35);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .activity-art-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .activity-art {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.08);
        }

        .activity-art-small {
            position: absolute;
            bottom: -3px;
            right: -3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #1a1a2e;
            object-fit: cover;
            background: #1a1a2e;
        }

        .activity-info {
            flex: 1;
            min-width: 0;
        }

        .activity-type-label {
            font-size: 10px;
            color: #8a90f5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .activity-name {
            font-size: 13px;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity-detail {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.65);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity-elapsed {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 2px;
        }

        
        .last-seen {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 4px;
        }

        .last-seen-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        
        .live-clock {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .live-clock-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        
        @keyframes skeleton-shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }

        .skeleton-text {
            display: inline-block;
            min-width: 60px;
            height: 12px;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.15) 37%, rgba(255,255,255,0.06) 63%);
            background-size: 400px 100%;
            animation: skeleton-shimmer 1.4s ease-in-out infinite;
            vertical-align: middle;
        }

        .skeleton-card {
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 10px;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
        }

        .skeleton-art {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            flex-shrink: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.15) 37%, rgba(255,255,255,0.06) 63%);
            background-size: 400px 100%;
            animation: skeleton-shimmer 1.4s ease-in-out infinite;
        }

        .skeleton-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .skeleton-lines .skeleton-text {
            width: 70%;
        }

        .skeleton-lines .skeleton-text:nth-child(2) {
            width: 45%;
        }

        
        .fade-transition {
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .fade-out {
            opacity: 0;
            transform: translateY(4px);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        .spotify-widget,
        .activity-card {
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .spotify-widget.fade-out,
        .activity-card.fade-out {
            opacity: 0;
            transform: translateY(4px);
        }

        .bio-separator {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
            opacity: 1 !important;
        }

        .profile-footer {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            margin-top: auto;
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            align-self: flex-start;
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .visitor-icon {
            width: 18px;
            height: 18px;
            color: white;
            opacity: 1 !important;
        }

        .visitor-counter .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            top: -35px;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visitor-counter:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        #visitor-count {
            opacity: 1 !important;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 0;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            pointer-events: auto;
            opacity: 1 !important;
            animation: socialIconPulse 3.6s ease-in-out infinite;
        }

        .social-links a:nth-child(1) .social-icon { animation-delay: 0s; }
        .social-links a:nth-child(2) .social-icon { animation-delay: 1.2s; }
        .social-links a:nth-child(3) .social-icon { animation-delay: 2.4s; }

        @keyframes socialIconPulse {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            }
            50% {
                filter: drop-shadow(0 0 16px rgba(255, 255, 255, 1));
            }
        }

        .social-icon:hover {
            transform: scale(1.4) rotateY(15deg);
            animation-play-state: paused;
        }

        
        #skills-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            max-height: 90vh;
            max-height: 90dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }

        .skills-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .skill {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .skill-name {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skill-icon {
            width: 22px;
            height: 22px;
            margin-right: 8px;
        }

        .skill-bar-container {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .skill-bar {
            height: 100%;
            border-radius: 5px;
            width: 0%;
            transition: width 2s;
        }

        #python-bar {
            background: linear-gradient(90deg, #ff6b6b, #ff9f9f);
        }

        #cpp-bar {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        #csharp-bar {
            background: linear-gradient(90deg, #43e97b, #38f9d7);
        }

        
        #results-button-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        #results-theme {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        #results-theme:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.8);
        }
